[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liverubric"
version = "0.2.0"
description = "LiveRubric: joint policy training and rubric evolution"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["liverubric*", "verl*", "rubric_generation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
